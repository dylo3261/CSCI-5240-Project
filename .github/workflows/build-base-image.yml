name: Build Lambda base image

on:
  push:
    branches: [main]
    paths:
      - 'lambda/base/Dockerfile'
      - '.github/workflows/build-base-image.yml'
  workflow_dispatch:   # allow manual trigger

env:
  AWS_REGION: us-west-2
  AWS_ACCOUNT_ID: '029953330549'
  ECR_REPO: lambda-gdal-base

jobs:
  build-base:
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR repository if needed
        run: |
          aws ecr create-repository \
            --repository-name $ECR_REPO \
            --region $AWS_REGION 2>/dev/null || echo "ECR repository already exists"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push base image
        env:
          IMAGE_URI: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPO }}:latest
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            --push \
            -t $IMAGE_URI \
            lambda/base/

      - name: Confirm base image pushed
        env:
          IMAGE_URI: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPO }}:latest
        run: echo "Base image available at $IMAGE_URI"
