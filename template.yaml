AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Avalanche Predictor - Real-time map reaction infrastructure

Globals:
  HttpApi:
    CorsConfiguration:
      AllowOrigins:
        - "*"
      AllowMethods:
        - GET
      AllowHeaders:
        - Content-Type

Resources:

  ActiveConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ActiveConnectionsTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH

  UserReactionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: UserReactionsTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: reactionId
          AttributeType: S
        - AttributeName: dataType
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: reactionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: TimeIndex
          KeySchema:
            - AttributeName: dataType
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: UserIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: AvalancheWebSocketApi
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: prod
      AutoDeploy: true

  WebSocketHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.lambda_handler
      CodeUri: lambda/websocket-handler/
      Runtime: python3.11
      Environment:
        Variables:
          CONNECTIONS_TABLE: !Ref ActiveConnectionsTable
          REACTIONS_TABLE: !Ref UserReactionsTable
          WEBSOCKET_ENDPOINT: !Sub "https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ActiveConnectionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UserReactionsTable
        - Statement:
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource:
                - !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"

  WebSocketIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketHandlerFunction.Arn}/invocations"

  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      AuthorizationType: NONE
      Target: !Sub "integrations/${WebSocketIntegration}"

  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $disconnect
      AuthorizationType: NONE
      Target: !Sub "integrations/${WebSocketIntegration}"

  SendReactionRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: sendReaction
      AuthorizationType: NONE
      Target: !Sub "integrations/${WebSocketIntegration}"

  WebSocketHandlerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WebSocketHandlerFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"

  FetchReactionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.lambda_handler
      CodeUri: lambda/fetch-reactions/
      Runtime: python3.11
      Environment:
        Variables:
          REACTIONS_TABLE: !Ref UserReactionsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UserReactionsTable
      Events:
        GetReactions:
          Type: HttpApi
          Properties:
            Path: /reactions
            Method: GET

  FetchUserReactionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.lambda_handler
      CodeUri: lambda/fetch-user-reactions/
      Runtime: python3.11
      Environment:
        Variables:
          REACTIONS_TABLE: !Ref UserReactionsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UserReactionsTable
      Events:
        GetUserReactions:
          Type: HttpApi
          Properties:
            Path: /user-reactions
            Method: GET

Outputs:
  ActiveConnectionsTableName:
    Value: !Ref ActiveConnectionsTable
  ActiveConnectionsTableArn:
    Value: !GetAtt ActiveConnectionsTable.Arn
  UserReactionsTableName:
    Value: !Ref UserReactionsTable
  UserReactionsTableArn:
    Value: !GetAtt UserReactionsTable.Arn
  WebSocketApiId:
    Value: !Ref WebSocketApi
  WebSocketApiEndpoint:
    Value: !Sub "wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  FetchReactionsEndpoint:
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/reactions"
  FetchUserReactionsEndpoint:
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/user-reactions"
